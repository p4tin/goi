version: '3'

# One repository, several apps built on the shared core (apps/<app>). APP
# picks the app; everything else follows from apps/<APP>/build/config.yml:
#   wails3 build                     # Goi
#   wails3 build APP=pyi             # Pyi
#   wails3 task darwin:package APP=pyi
#   wails3 dev -config apps/pyi/build/config.yml   (its dev_mode passes APP=pyi)
vars:
  APP: '{{.APP | default "goi"}}'
  APP_DIR: 'apps/{{.APP}}'
  # Go package of the app's main.
  MAIN_PKG: './apps/{{.APP}}'
  # Binary name; the macOS bundle is <PRODUCT_NAME>.app (the binary inside stays APP_NAME).
  APP_NAME: '{{.APP}}'
  # The app id title-cased (goi → Goi), which matches info.productName in
  # each app's build/config.yml. No shell script: Task's Windows shell can't
  # run one. Override with PRODUCT_NAME=... for an app whose name differs.
  PRODUCT_NAME: '{{.PRODUCT_NAME | default (.APP | title)}}'

  # Full product version stamped into paths.BuildVersion for release builds
  # (wails3 task package BUILD_VERSION=0.1.2). Empty leaves the default "dev".
  BUILD_VERSION: '{{.BUILD_VERSION | default ""}}'
  # Each app builds into its own folder, so they never overwrite each other.
  BIN_DIR: 'bin/{{.APP}}'
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application (APP=goi|pyi)
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application (APP=goi|pyi)
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application (APP=goi|pyi)
    cmds:
      - task: "{{.GOOS}}:run"

  bindings:
    summary: Regenerates frontend/bindings for every app (replaces `wails generate module`)
    cmds:
      - task: common:generate:bindings

  dev:
    summary: Runs the application in development mode (APP=goi|pyi)
    cmds:
      - wails3 dev -config ./{{.APP_DIR}}/build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
