name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        # Goi builds Linux with the gtk3 tag (GTK3 + WebKitGTK 4.1).
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "GOFLAGS=-tags=gtk3" >> "$GITHUB_ENV"

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build (populates frontend/dist for go:embed)
        working-directory: frontend
        run: npm run build

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go vet (E2E server build)
        if: runner.os != 'Linux'
        run: go vet -tags server ./internal/rpc

      - name: go test
        run: go test ./internal/...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Wails build
        shell: bash
        run: wails3 build

      - uses: actions/upload-artifact@v4
        with:
          name: goi-${{ matrix.os }}
          path: bin/
          retention-days: 7

  arm64-compile:
    name: arm64 compile-only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend build (populates frontend/dist for go:embed)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Core packages (linux/arm64, windows/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build ./internal/...
          GOOS=windows GOARCH=arm64 go build ./internal/...

      - name: App binary (windows/arm64, cgo-free)
        run: GOOS=windows GOARCH=arm64 go build -o /tmp/goi-arm64.exe .
