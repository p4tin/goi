name: release

# Builds one app's installers for macOS, Windows and Linux. The tag picks
# the app: goi-v<version> (or the older v<version>) releases Goi,
# pyi-v<version> releases Pyi; the version must match the app's
# apps/<app>/build/config.yml. On a tag the packages are published as a draft
# GitHub Release; started by hand (choose the app) it only uploads them as
# workflow artifacts.

on:
  push:
    tags: ['v*', 'goi-v*', 'pyi-v*']
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        type: choice
        options: [goi, pyi]
        default: goi

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0
  NFPM_VERSION: v2.43.0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      app: ${{ steps.v.outputs.app }}
      product: ${{ steps.v.outputs.product }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              pyi-v*) app=pyi ;;
              *) app=goi ;;
            esac
            v=$(scripts/version.sh "$app" "${GITHUB_REF_NAME}")
          else
            app="${{ inputs.app || 'goi' }}"
            v=$(scripts/version.sh "$app")
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "product=$(scripts/app-info.sh "$app" productName)" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP: ${{ needs.version.outputs.app }}
      PRODUCT: ${{ needs.version.outputs.product }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build universal app
        run: wails3 task darwin:package:universal APP="${APP}" BUILD_VERSION="${VERSION}"
      - name: Sign and notarize (when certificates are configured)
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "bin/${APP}/${PRODUCT}.app"
          ditto -c -k --keepParent "bin/${APP}/${PRODUCT}.app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple "bin/${APP}/${PRODUCT}.app"
      - name: Package dmg and zip
        run: |
          mkdir -p dist
          build/package/macos/make-dmg.sh "bin/${APP}/${PRODUCT}.app" "dist/${PRODUCT}-${VERSION}-macos-universal.dmg" "${PRODUCT}"
          ditto -c -k --keepParent "bin/${APP}/${PRODUCT}.app" "dist/${PRODUCT}-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app }}-macos
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP: ${{ needs.version.outputs.app }}
      PRODUCT: ${{ needs.version.outputs.product }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Install NSIS
        run: choco install nsis -y --no-progress && echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      # windows:build always writes bin/<app>/<app>.exe and doesn't set
      # GOARCH, so each arch's exe is moved to bin/<app>/<arch>/ before the
      # next build.
      - name: Build amd64 installer
        run: |
          GOARCH=amd64 wails3 task windows:package APP="${APP}" ARCH=amd64 BUILD_VERSION="${VERSION}"
          mkdir -p "bin/${APP}/amd64" && mv "bin/${APP}/${APP}.exe" "bin/${APP}/amd64/${APP}.exe"
      - name: Build arm64 (portable)
        run: |
          GOARCH=arm64 wails3 task windows:build APP="${APP}" ARCH=arm64 BUILD_VERSION="${VERSION}"
          mkdir -p "bin/${APP}/arm64" && mv "bin/${APP}/${APP}.exe" "bin/${APP}/arm64/${APP}.exe"
      - name: Sign (when a certificate is configured)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem bin -Recurse -Filter *.exe | ForEach-Object { & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
      - name: Package
        run: |
          mkdir -p dist
          cp "bin/${APP}/${APP}-amd64-installer.exe" "dist/${PRODUCT}-${VERSION}-windows-amd64-installer.exe"
          for arch in amd64 arm64; do
            exe="bin/${APP}/$arch/${APP}.exe"
            go version -m "$exe" | grep -q "GOARCH=$arch" || { echo "$exe is not $arch"; exit 1; }
            (cd "bin/${APP}/$arch" && 7z a "../../../dist/${PRODUCT}-${VERSION}-windows-${arch}.zip" "${APP}.exe" >/dev/null)
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app }}-windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP: ${{ needs.version.outputs.app }}
      PRODUCT: ${{ needs.version.outputs.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # The CLI links Wails too: without gtk3 it needs GTK4/WebKitGTK 6.0.
      - run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
      - name: Build
        # EXTRA_TAGS defaults to gtk3 (GTK3 + WebKitGTK 4.1) in build/linux/Taskfile.yml.
        run: wails3 task linux:build APP="${APP}" BUILD_VERSION="${VERSION}"
      - name: Package deb, rpm and tar.gz
        run: |
          mkdir -p dist
          cfg="apps/${APP}/build/package/linux/nfpm.yaml"
          GOARCH=amd64 APP_VERSION="$VERSION" nfpm package -f "$cfg" -p deb -t "dist/${APP}_${VERSION}_amd64.deb"
          GOARCH=amd64 APP_VERSION="$VERSION" nfpm package -f "$cfg" -p rpm -t "dist/${APP}-${VERSION}.x86_64.rpm"
          stage="${APP}-${VERSION}-linux-amd64"
          mkdir -p "$stage"
          cp "bin/${APP}/${APP}" "apps/${APP}/build/package/linux/${APP}.desktop" "apps/${APP}/build/appicon.png" "$stage/"
          tar -czf "dist/${PRODUCT}-${VERSION}-linux-amd64.tar.gz" "$stage"
      - name: Check the deb
        run: dpkg-deb --info "dist/${APP}_${VERSION}_amd64.deb" && dpkg-deb --contents "dist/${APP}_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app }}-linux
          path: dist/*

  release:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app }}-release
          path: dist/*
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.version.outputs.product }} ${{ needs.version.outputs.version }}
          draft: true
          files: dist/*
          body: |
            ${{ needs.version.outputs.product }} ${{ needs.version.outputs.version }}

            - macOS (Apple silicon and Intel): `.dmg` (drag ${{ needs.version.outputs.product }} to Applications) or `.zip`
            - Windows: `-installer.exe`, or the portable `.zip` (amd64, arm64)
            - Linux: `.deb`, `.rpm`, or `.tar.gz`

            Unsigned builds: see "Installing" in the README for how to open them.
