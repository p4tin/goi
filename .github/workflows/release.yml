name: release

# Builds installers for macOS, Windows and Linux. On a version tag (v*) the
# packages are published as a GitHub Release; started by hand it only
# uploads them as workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.1
  NFPM_VERSION: v2.43.0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v=$(scripts/version.sh "${GITHUB_REF_NAME}")
          else
            v=$(scripts/version.sh)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build universal app
        run: wails build -platform darwin/universal -ldflags "-X github.com/p4tin/goi/internal/paths.BuildVersion=${VERSION}"
      - name: Sign and notarize (when certificates are configured)
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" build/bin/Goi.app
          ditto -c -k --keepParent build/bin/Goi.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple build/bin/Goi.app
      - name: Package dmg and zip
        run: |
          mkdir -p dist
          build/package/macos/make-dmg.sh build/bin/Goi.app "dist/Goi-${VERSION}-macos-universal.dmg"
          ditto -c -k --keepParent build/bin/Goi.app "dist/Goi-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: goi-macos
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install NSIS
        run: choco install nsis -y --no-progress && echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      - name: Build amd64 installer
        run: wails build -platform windows/amd64 -nsis -webview2 embed -ldflags "-X github.com/p4tin/goi/internal/paths.BuildVersion=${VERSION}"
      - name: Build arm64 (portable)
        run: wails build -platform windows/arm64 -webview2 embed -o goi-arm64.exe -skipbindings -ldflags "-X github.com/p4tin/goi/internal/paths.BuildVersion=${VERSION}"
      - name: Sign (when a certificate is configured)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem build/bin/*.exe | ForEach-Object { & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
      - name: Package
        run: |
          mkdir -p dist
          ls build/bin
          cp build/bin/*installer*.exe "dist/Goi-${VERSION}-windows-amd64-installer.exe"
          (cd build/bin && 7z a "../../dist/Goi-${VERSION}-windows-amd64.zip" goi.exe >/dev/null)
          (cd build/bin && 7z a "../../dist/Goi-${VERSION}-windows-arm64.zip" goi-arm64.exe >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: goi-windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
      - name: Build
        run: wails build -tags webkit2_41 -ldflags "-X github.com/p4tin/goi/internal/paths.BuildVersion=${VERSION}"
      - name: Package deb, rpm and tar.gz
        run: |
          mkdir -p dist
          GOI_VERSION="$VERSION" nfpm package -f build/package/linux/nfpm.yaml -p deb -t "dist/goi_${VERSION}_amd64.deb"
          GOI_VERSION="$VERSION" nfpm package -f build/package/linux/nfpm.yaml -p rpm -t "dist/goi-${VERSION}.x86_64.rpm"
          stage="goi-${VERSION}-linux-amd64"
          mkdir -p "$stage"
          cp build/bin/goi build/package/linux/goi.desktop build/appicon.png "$stage/"
          tar -czf "dist/Goi-${VERSION}-linux-amd64.tar.gz" "$stage"
      - name: Check the deb
        run: dpkg-deb --info "dist/goi_${VERSION}_amd64.deb" && dpkg-deb --contents "dist/goi_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: goi-linux
          path: dist/*

  release:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: goi-release
          path: dist/*
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Goi ${{ needs.version.outputs.version }}
          draft: true
          files: dist/*
          body: |
            Goi ${{ needs.version.outputs.version }}

            - macOS (Apple silicon and Intel): `.dmg` (drag Goi to Applications) or `.zip`
            - Windows: `-installer.exe`, or the portable `.zip` (amd64, arm64)
            - Linux: `.deb`, `.rpm`, or `.tar.gz`

            Unsigned builds: see "Installing" in the README for how to open them.
