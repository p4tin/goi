name: release

# Builds installers for macOS, Windows and Linux. On a version tag (v*) the
# packages are published as a GitHub Release; started by hand it only
# uploads them as workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0
  NFPM_VERSION: v2.43.0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v=$(scripts/version.sh "${GITHUB_REF_NAME}")
          else
            v=$(scripts/version.sh)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build universal app
        run: wails3 task darwin:package:universal BUILD_VERSION="${VERSION}"
      - name: Sign and notarize (when certificates are configured)
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" bin/Goi.app
          ditto -c -k --keepParent bin/Goi.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple bin/Goi.app
      - name: Package dmg and zip
        run: |
          mkdir -p dist
          build/package/macos/make-dmg.sh bin/Goi.app "dist/Goi-${VERSION}-macos-universal.dmg"
          ditto -c -k --keepParent bin/Goi.app "dist/Goi-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: goi-macos
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Install NSIS
        run: choco install nsis -y --no-progress && echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      # windows:build always writes bin/goi.exe and doesn't set GOARCH, so each
      # arch's exe is moved to bin/<arch>/ before the next build.
      - name: Build amd64 installer
        run: |
          GOARCH=amd64 wails3 task windows:package ARCH=amd64 BUILD_VERSION="${VERSION}"
          mkdir -p bin/amd64 && mv bin/goi.exe bin/amd64/goi.exe
      - name: Build arm64 (portable)
        run: |
          GOARCH=arm64 wails3 task windows:build ARCH=arm64 BUILD_VERSION="${VERSION}"
          mkdir -p bin/arm64 && mv bin/goi.exe bin/arm64/goi.exe
      - name: Sign (when a certificate is configured)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem bin -Recurse -Filter *.exe | ForEach-Object { & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
      - name: Package
        run: |
          mkdir -p dist
          cp bin/goi-amd64-installer.exe "dist/Goi-${VERSION}-windows-amd64-installer.exe"
          for arch in amd64 arm64; do
            go version -m "bin/$arch/goi.exe" | grep -q "GOARCH=$arch" || { echo "bin/$arch/goi.exe is not $arch"; exit 1; }
            (cd "bin/$arch" && 7z a "../../dist/Goi-${VERSION}-windows-${arch}.zip" goi.exe >/dev/null)
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: goi-windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # The CLI links Wails too: without gtk3 it needs GTK4/WebKitGTK 6.0.
      - run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
      - name: Build
        # EXTRA_TAGS defaults to gtk3 (GTK3 + WebKitGTK 4.1) in build/linux/Taskfile.yml.
        run: wails3 task linux:build BUILD_VERSION="${VERSION}"
      - name: Package deb, rpm and tar.gz
        run: |
          mkdir -p dist
          GOARCH=amd64 GOI_VERSION="$VERSION" nfpm package -f build/package/linux/nfpm.yaml -p deb -t "dist/goi_${VERSION}_amd64.deb"
          GOARCH=amd64 GOI_VERSION="$VERSION" nfpm package -f build/package/linux/nfpm.yaml -p rpm -t "dist/goi-${VERSION}.x86_64.rpm"
          stage="goi-${VERSION}-linux-amd64"
          mkdir -p "$stage"
          cp bin/goi build/package/linux/goi.desktop build/appicon.png "$stage/"
          tar -czf "dist/Goi-${VERSION}-linux-amd64.tar.gz" "$stage"
      - name: Check the deb
        run: dpkg-deb --info "dist/goi_${VERSION}_amd64.deb" && dpkg-deb --contents "dist/goi_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: goi-linux
          path: dist/*

  release:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: goi-release
          path: dist/*
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Goi ${{ needs.version.outputs.version }}
          draft: true
          files: dist/*
          body: |
            Goi ${{ needs.version.outputs.version }}

            - macOS (Apple silicon and Intel): `.dmg` (drag Goi to Applications) or `.zip`
            - Windows: `-installer.exe`, or the portable `.zip` (amd64, arm64)
            - Linux: `.deb`, `.rpm`, or `.tar.gz`

            Unsigned builds: see "Installing" in the README for how to open them.
