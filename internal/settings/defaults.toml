# Goi built-in defaults. User settings override these; project settings
# (.goi/settings.toml) override user settings.

[startup]
reopenLastProject = true

[editor]
fontFamily = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
fontSize = 13
tabSize = 4
softWrap = false
maxHighlightSizeKB = 2500   # larger files open without highlighting
maxOpenSizeKB = 20000       # larger files open read-only

[go]
goroot = ""                 # empty: auto-detect
env = {}                    # extra environment for go commands
tags = []                   # build tags
goos = ""                   # empty: host
goarch = ""                 # empty: host
cgo = ""                    # "", "0" or "1"
vendor = "auto"             # auto | on | off

[project]
contentRoots = []
excludes = [".git", "node_modules", ".idea", ".goi/cache"]

[save]
format = "goimports"        # goimports | gofmt | none

[gopls]
enabled = true
path = ""                   # empty: $PATH, $GOBIN, $GOPATH/bin, then Goi's tools dir
usePlaceholders = true      # completion inserts parameter placeholders
staticcheck = false         # extra staticcheck analyzers in diagnostics
settings = {}               # passed through to the gopls configuration

[ui]
theme = "auto"              # auto | light | dark | hc
scheme = "auto" # auto follows the UI theme; or goi-light, goi-dark, goi-ember, goi-paper
keymap = "goi-default"

[keys]                      # user-only: commandId = ["Mod-k Mod-s"]
