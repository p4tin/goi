apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
    labels: {app: web, tier: frontend}
spec:
    replicas: 3
    template:
        spec:
            containers:
            -   name: web
                image: "nginx:1.27"
                ports:
                -   containerPort: 80
                args: ["--port", "80"]
---
# The service.
apiVersion: v1
kind: Service
metadata:
    name: web
spec:
    ports:
    - port: 80
      targetPort: 80
