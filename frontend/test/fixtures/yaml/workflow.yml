name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Matrix over OSes.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod   # keep in sync
    - name: Test
      run: |
        go test -race ./...
        go vet ./...
      env:
        CGO_ENABLED: "1"
        GOFLAGS: '-buildvcs=false'
