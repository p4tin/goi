# nfpm configuration for the Linux .deb and .rpm packages (Wails v3 build).
# Pyi's own file: `wails3 update build-assets` regenerates build/linux/nfpm/nfpm.yaml,
# so the packaging tasks use this one instead. Paths are relative to the repo root.
#   APP_VERSION=0.1.0 GOARCH=amd64 wails3 tool package -name pyi -format deb -config apps/pyi/build/package/linux/nfpm.yaml -out bin/pyi
# The linux:create:deb / linux:create:rpm tasks set APP_VERSION from scripts/version.sh.
name: pyi
arch: ${GOARCH}
platform: linux
version: ${APP_VERSION}
section: devel
priority: optional
maintainer: Goi contributors <goi@example.com>
description: |
  Pyi is a cross-platform Python IDE (basedpyright code intelligence,
  run configurations, git, terminal and AI agents).
homepage: https://github.com/p4tin/goi
license: Proprietary
contents:
  - src: ./bin/pyi/pyi
    dst: /usr/bin/pyi
    file_info:
      mode: 0755
  - src: ./apps/pyi/build/package/linux/pyi.desktop
    dst: /usr/share/applications/pyi.desktop
  - src: ./apps/pyi/build/appicon.png
    dst: /usr/share/pixmaps/pyi.png
scripts:
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
# Pyi builds Linux with `-tags gtk3` (GTK3 + WebKitGTK 4.1) so the packages
# keep working on Ubuntu 22.04 and Debian 12. Wails v3's default GTK4 build
# would need libgtk-4-1 / libwebkitgtk-6.0-4 (rpm: gtk4 / webkitgtk6.0).
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
