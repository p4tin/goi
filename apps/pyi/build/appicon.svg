<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pyi app icon (source of truth): Goi's tile, gradient and mint "i", with a big P. Regenerate build/appicon.png and build/windows/icon.ico with scripts/icons.sh pyi. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3B63"/>
      <stop offset="1" stop-color="#0A1424"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FE3FF"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <g filter="url(#shadow)">
    <!-- P: stem, then the bowl (straight top, round right side, back to the stem). -->
    <path d="M372 742 L372 282 L532 282 A120 120 0 0 1 532 522 L372 522" fill="none" stroke="url(#g)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- i: the same mint bar as Goi's, right of the P, under its bowl, bottom-aligned with the stem. -->
    <rect x="616" y="612" width="44" height="176" rx="14" fill="#9BF2C8"/>
  </g>
</svg>
