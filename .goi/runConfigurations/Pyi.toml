# Builds and runs Pyi from inside Goi (Delve can debug it too).
name = "Pyi"
type = "app"
kind = "package"
package = "./apps/pyi"
buildFlags = "-tags production -ldflags=-extldflags=-Wl,-sectcreate,__TEXT,__info_plist,apps/pyi/build/darwin/Info.goland.plist"

[env]
PYI_HOME = ".pyi-home"

[[beforeLaunch]]
type = "command"
command = "npm --prefix frontend run build:pyi"
